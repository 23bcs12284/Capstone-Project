# Model Training Hyperparameters Grid Search Configuration

logistic_regression:
  C: [0.1, 1.0, 10.0]
  penalty: ['l2']
  solver: ['lbfgs']

decision_tree:
  max_depth: [5, 10]
  min_samples_split: [2, 5]
  criterion: ['gini']

random_forest:
  n_estimators: [50, 100]
  max_depth: [5, 10]
  min_samples_split: [2, 5]

gradient_boosting:
  n_estimators: [50, 100]
  learning_rate: [0.05, 0.1]
  max_depth: [3, 5]

xgboost:
  n_estimators: [50, 100]
  learning_rate: [0.05, 0.1]
  max_depth: [3, 5]

lightgbm:
  n_estimators: [50, 100]
  learning_rate: [0.05, 0.1]
  max_depth: [3, 5]

catboost:
  iterations: [50, 100]
  learning_rate: [0.05, 0.1]
  depth: [4, 6]
  verbose: [0]

svm:
  C: [0.1, 1.0]
  kernel: ['rbf']

extra_trees:
  n_estimators: [50, 100]
  max_depth: [5, 10]
  min_samples_split: [2, 5]

