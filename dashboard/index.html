<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoanAI Decision Platform</title>
    <meta name="description" content="Explainable AI Loan Approval Decision Support System">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Styles -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Mobile Backdrop Overlay -->
    <div class="sidebar-overlay" id="sidebar-overlay" onclick="closeMobileMenu()"></div>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <i class="fa-solid fa-brain"></i>
                <span class="logo-text">LoanAI</span>
            </div>
            <button class="toggle-btn" id="sidebar-toggle" onclick="toggleSidebar()">
                <i class="fa-solid fa-bars"></i>
            </button>
            <button class="close-mobile-btn" onclick="closeMobileMenu()">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <nav class="sidebar-nav">
            <a href="#dashboard" class="nav-item active" title="Dashboard">
                <i class="fa-solid fa-house"></i>
                <span class="nav-label">Dashboard</span>
            </a>
            <a href="#prediction" class="nav-item" title="Loan Prediction">
                <i class="fa-solid fa-wand-magic-sparkles"></i>
                <span class="nav-label">Loan Prediction</span>
            </a>
            <a href="#applicant" class="nav-item" title="Applicant Analysis">
                <i class="fa-solid fa-user-shield"></i>
                <span class="nav-label">Applicant Analysis</span>
            </a>
            <a href="#model_comparison" class="nav-item" title="Model Comparison">
                <i class="fa-solid fa-chart-simple"></i>
                <span class="nav-label">Model Comparison</span>
            </a>
            <a href="#explainability" class="nav-item" title="Explainability">
                <i class="fa-solid fa-network-wired"></i>
                <span class="nav-label">Explainability</span>
            </a>
            <a href="#datasets" class="nav-item" title="Datasets">
                <i class="fa-solid fa-folder-open"></i>
                <span class="nav-label">Datasets</span>
            </a>
            <a href="#experiments" class="nav-item" title="Experiments">
                <i class="fa-solid fa-flask"></i>
                <span class="nav-label">Experiments</span>
            </a>
            <a href="#fairness" class="nav-item" title="Fairness">
                <i class="fa-solid fa-scale-balanced"></i>
                <span class="nav-label">Fairness</span>
            </a>
            <a href="#evaluation" class="nav-item" title="Model Evaluation">
                <i class="fa-solid fa-chart-line"></i>
                <span class="nav-label">Model Evaluation</span>
            </a>
            <a href="#model_management" class="nav-item" title="Model Management">
                <i class="fa-solid fa-gear"></i>
                <span class="nav-label">Model Management</span>
            </a>
        </nav>
    </aside>

    <!-- Main Wrapper -->
    <div class="main-wrapper" id="main-wrapper">
        <!-- Header -->
        <header class="topbar">
            <div class="topbar-left">
                <button class="mobile-toggle-btn" id="mobile-menu-toggle" onclick="toggleMobileMenu()">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <div class="breadcrumb" id="page-breadcrumb">
                    <h2>Dashboard</h2>
                </div>
            </div>
            <div class="global-selectors">
                <div class="selector-group">
                    <label for="global-dataset-select">Dataset:</label>
                    <select id="global-dataset-select" class="form-select">
                        <option value="default">Loading...</option>
                    </select>
                </div>
                <div class="selector-group">
                    <label for="global-model-select">Model:</label>
                    <select id="global-model-select" class="form-select">
                        <option value="default">Loading...</option>
                    </select>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="content-area" id="main-content">
            <!-- Dynamic content will be injected here -->
        </main>
    </div>

    <!-- Mobile Bottom Navigation Bar -->
    <nav class="mobile-nav" id="mobile-nav">
        <a href="#dashboard" class="mobile-nav-item active" data-hash="dashboard">
            <i class="fa-solid fa-house"></i>
            <span>Dashboard</span>
        </a>
        <a href="#prediction" class="mobile-nav-item" data-hash="prediction">
            <i class="fa-solid fa-wand-magic-sparkles"></i>
            <span>Predict</span>
        </a>
        <a href="#model_comparison" class="mobile-nav-item" data-hash="model_comparison">
            <i class="fa-solid fa-chart-simple"></i>
            <span>Compare</span>
        </a>
        <a href="#datasets" class="mobile-nav-item" data-hash="datasets">
            <i class="fa-solid fa-folder-open"></i>
            <span>Datasets</span>
        </a>
        <button class="mobile-nav-item mobile-menu-btn" onclick="toggleMobileMenu()">
            <i class="fa-solid fa-ellipsis"></i>
            <span>More</span>
        </button>
    </nav>

    <!-- Toast Notifications -->
    <div class="toast-container" id="toast-container"></div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loading-overlay" style="display: none;">
        <div class="spinner"></div>
    </div>

    <!-- App Scripts -->
    <script src="js/app.js"></script>
    <script src="js/pages/dashboard.js"></script>
    <script src="js/pages/prediction.js"></script>
    <script src="js/pages/applicant.js"></script>
    <script src="js/pages/model_comparison.js"></script>
    <script src="js/pages/explainability.js"></script>
    <script src="js/pages/datasets.js"></script>
    <script src="js/pages/experiments.js"></script>
    <script src="js/pages/fairness.js"></script>
    <script src="js/pages/evaluation.js"></script>
    <script src="js/pages/model_management.js"></script>
</body>
</html>
